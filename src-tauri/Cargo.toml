[package]
name = "netwatch-ir"
version = "0.3.2"
edition = "2021"

[lib]
name = "netwatch_ir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
if-watch = { version = "3", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surge-ping = "0.8"
socket2 = "0.5"
hickory-resolver = "0.24"
netdev = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
rand = "0.8"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
	"Win32_Foundation", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper",
	"Win32_NetworkManagement_Ndis",
	"Win32_Networking_WinSock",
] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.6"
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
notify = "6"
